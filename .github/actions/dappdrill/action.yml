name: DappDrill
description: Run your web3 app's DappDrill tests on local forks and comment the results on the PR.
branding:
  icon: check-circle
  color: blue

inputs:
  url:
    description: URL to test (a preview deployment, or a local server started earlier in the job). Default the URL in the tests file.
    required: false
  file:
    description: Tests file, made with `dappdrill analyze <url>`.
    default: .dappdrill/tests.json
  unhappy:
    description: Also run the usual unhappy paths (rejected in wallet, slow RPC, wrong network, low gas) for tests that ask the wallet to sign ("true"/"false").
    default: "false"
  conditions:
    description: More unhappy paths to run, as condition ids separated by spaces, e.g. "failing-rpc reload-mid-flow".
    required: false
  fail-on-dangerous:
    description: Fail the job when a signing request is Dangerous, even if the tests passed ("true"/"false").
    default: "false"
  comment:
    description: Post (and keep updating) a summary comment on the pull request ("true"/"false").
    default: "true"
  github-token:
    description: Token used for the PR comment.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: The CLI's exit code (0 all passed, 1 a test failed or fail-on-dangerous tripped, 2 a test couldn't run, the run stopped, or nothing ran).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install DappDrill
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        corepack enable
        corepack pnpm install --frozen-lockfile --filter "@dappdrill/cli..."
        echo "DAPPDRILL_BIN=$PWD/packages/cli/bin/dappdrill.js" >> "$GITHUB_ENV"

    - uses: foundry-rs/foundry-toolchain@v1

    - name: Install Chromium
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: corepack pnpm --filter @dappdrill/engine exec playwright install --with-deps chromium

    - name: Run tests
      id: run
      shell: bash
      env:
        IN_URL: ${{ inputs.url }}
        IN_FILE: ${{ inputs.file }}
        IN_UNHAPPY: ${{ inputs.unhappy }}
        IN_CONDITIONS: ${{ inputs.conditions }}
        IN_FAIL_ON_DANGEROUS: ${{ inputs.fail-on-dangerous }}
      run: |
        args=(run "$IN_FILE" --out dappdrill-out --junit dappdrill-out/junit.xml)
        [ -n "$IN_URL" ] && args+=(--url "$IN_URL")
        [ "$IN_UNHAPPY" = "true" ] && args+=(--unhappy)
        for c in $IN_CONDITIONS; do args+=(--condition "$c"); done
        [ "$IN_FAIL_ON_DANGEROUS" = "true" ] && args+=(--fail-on-dangerous)
        set +e
        node "$DAPPDRILL_BIN" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        [ -f dappdrill-out/summary.md ] && cat dappdrill-out/summary.md >> "$GITHUB_STEP_SUMMARY"
        true

    - name: Upload videos and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dappdrill
        path: dappdrill-out
        if-no-files-found: ignore

    - name: Comment on the PR
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && hashFiles('dappdrill-out/summary.md') != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- dappdrill -->";
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const summary = fs.readFileSync("dappdrill-out/summary.md", "utf8");
          const body = `${marker}\n${summary}\n[Videos and screenshots](${runUrl})`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body?.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Result
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code || 2 }}
