name: DappDrill
description: Replay your dApp's saved flows on local forks, check what users are asked to sign, and comment the results on the PR.
branding:
  icon: check-circle
  color: blue

inputs:
  url:
    description: URL of the dApp to test (a preview deployment, or a local server started earlier in the job). Optional with `pull`.
    required: false
  flows-dir:
    description: Directory of saved flow files.
    default: .dappdrill/flows
  edge-cases:
    description: Comma-separated edge cases, e.g. "happy,reject,wrong-network". Default happy, or the app's set with `pull`.
    required: false
  fail-on:
    description: Fail the job at this health or worse — broken, review or never.
    default: broken
  baseline:
    description: Accepted signing reviews.
    default: .dappdrill/baselines.json
  report-to:
    description: DappDrill web app URL to report results to (and pull flows from with `pull`).
    required: false
  token:
    description: The app's API token from DappDrill (Settings → CI). Needed with report-to.
    required: false
  pull:
    description: Also run the flows saved in the DappDrill web app ("true"/"false").
    default: "false"
  comment:
    description: Post (and keep updating) a summary comment on the pull request ("true"/"false").
    default: "true"
  github-token:
    description: Token used for the PR comment.
    default: ${{ github.token }}

outputs:
  health:
    description: OK, Review or Broken.
    value: ${{ steps.run.outputs.health }}
  exit-code:
    description: The CLI's exit code (0 ok, 1 at or above fail-on, 2 error).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install DappDrill
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        corepack enable
        corepack pnpm install --frozen-lockfile --filter "@dappdrill/cli..."
        echo "DAPPDRILL_BIN=$PWD/packages/cli/bin/dappdrill.js" >> "$GITHUB_ENV"

    - uses: foundry-rs/foundry-toolchain@v1

    - name: Install Chromium
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: corepack pnpm --filter @dappdrill/engine exec playwright install --with-deps chromium

    - name: Run flows
      id: run
      shell: bash
      env:
        DAPPDRILL_TOKEN: ${{ inputs.token }}
        DAPPDRILL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        DAPPDRILL_BRANCH: ${{ github.head_ref || github.ref_name }}
        IN_URL: ${{ inputs.url }}
        IN_FLOWS_DIR: ${{ inputs.flows-dir }}
        IN_EDGE_CASES: ${{ inputs.edge-cases }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_REPORT_TO: ${{ inputs.report-to }}
        IN_PULL: ${{ inputs.pull }}
      run: |
        args=(run --out dappdrill-out --junit dappdrill-out/junit.xml --flows-dir "$IN_FLOWS_DIR" --baseline "$IN_BASELINE" --fail-on "$IN_FAIL_ON")
        [ -n "$IN_URL" ] && args+=(--url "$IN_URL")
        [ -n "$IN_EDGE_CASES" ] && args+=(--edge-cases "$IN_EDGE_CASES")
        [ -n "$IN_REPORT_TO" ] && args+=(--report-to "$IN_REPORT_TO")
        [ "$IN_PULL" = "true" ] && args+=(--pull)
        set +e
        node "$DAPPDRILL_BIN" "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        if [ -f dappdrill-out/report.md ]; then
          echo "health=$(grep -m1 -oE '^\*\*(OK|Review|Broken):' dappdrill-out/report.md | tr -d '*:')" >> "$GITHUB_OUTPUT"
          cat dappdrill-out/report.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload report and artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dappdrill
        path: dappdrill-out
        if-no-files-found: ignore

    - name: Comment on the PR
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request' && hashFiles('dappdrill-out/report.md') != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- dappdrill -->";
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          let report = fs.readFileSync("dappdrill-out/report.md", "utf8");
          if (report.length > 60000) report = report.slice(0, 60000) + "\n\n…cut short; the full report is in the run's artifacts.";
          const body = `${marker}\n${report}\n\n[Videos, screenshots and traces](${runUrl})`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body?.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - name: Result
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code || 2 }}
