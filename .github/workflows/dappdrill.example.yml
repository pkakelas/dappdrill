# Example: copy to .github/workflows/dappdrill.yml in your dApp's repo.
#
# Runs the tests in .dappdrill/tests.json against the PR's build on local forks, comments the
# results on the PR, and fails when a test fails. Make the tests file once with
# `dappdrill analyze <url>` and commit it.
name: DappDrill

on:
  # In your repo, use `pull_request:` here. This copy only runs by hand so it doesn't fire on DappDrill's own PRs.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dappdrill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Serve the PR's build. Any URL works, e.g. a preview deployment instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npx --yes serve -s dist -l 4173 &
      - run: npx --yes wait-on http://localhost:4173

      - uses: dappdrill/dappdrill/.github/actions/dappdrill@main
        with:
          url: http://localhost:4173
          unhappy: "true"
        env:
          # The tests run Claude when a cached step stops working.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # The same tests against a preview deployment instead of a local build: pass the deploy's URL
  # to `url:`. The tests and their saved steps are the app's own; only the address changes.
  # Here the URL comes from a deploy step's output (Vercel below; Netlify's action outputs `deploy-url`).
  # Remove `if: false` once your deploy step is in place.
  dappdrill-preview:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - uses: dappdrill/dappdrill/.github/actions/dappdrill@main
        with:
          url: ${{ steps.deploy.outputs.preview-url }}
          unhappy: "true"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
