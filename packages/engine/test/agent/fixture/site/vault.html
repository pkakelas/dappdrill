<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tiny Vault — Vault</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    nav a { margin-right: 1rem; }
    [hidden] { display: none !important; }
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); }
    .modal { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); background: #fff; padding: 1.5rem; border-radius: 8px; }
    .modal button { display: block; margin: .5rem 0; }
    .row { margin: 1rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/vault.html">Vault</a>
  </nav>
  <h1>USDC Vault</h1>
  <button id="connect">Connect wallet</button>
  <span id="account" hidden></span>

  <section id="vault" hidden>
    <p>Wallet balance: <span id="balance">1,000.00</span> USDC</p>
    <p>Deposited: <span id="deposited">0.00</span> USDC</p>
    <p>Claimable rewards: <span id="rewards">3.50</span> USDC</p>
    <div class="row">
      <label for="amount">Amount</label>
      <input id="amount" type="text" inputmode="decimal" placeholder="0.00" />
      <span>USDC</span>
    </div>
    <div class="row">
      <button id="deposit">Deposit</button>
      <button id="withdraw">Withdraw</button>
      <button id="claim">Claim rewards</button>
      <button id="signin">Sign in</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <div id="picker" hidden>
    <div class="backdrop"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <h2 id="picker-title">Connect a wallet</h2>
      <button data-wallet="metamask">MetaMask</button>
      <button data-wallet="walletconnect">WalletConnect</button>
      <button id="picker-close" aria-label="Close">×</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
